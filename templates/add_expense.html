{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<div class="form-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Add Expense</h1>
            <p class="auth-subtitle">Log your spending in seconds</p>
        </div>

        <div class="auth-card">
            <form action="{{ url_for('add_expense') }}" method="POST">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" step="0.01" name="amount" class="form-input" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category" class="form-input" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Food">Food & Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills & Utilities</option>
                        <option value="Health">Health & Medical</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <input type="text" name="description" class="form-input" placeholder="What was this for?">
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="date" class="form-input" required>
                </div>

                <button type="submit" class="btn-submit">Save Expense</button>
            </form>
        </div>

        <div class="auth-switch">
            <a href="{{ url_for('profile') }}">← Back to Profile</a>
        </div>
    </div>
</div>
{% endblock %}
