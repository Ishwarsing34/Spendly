{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<div class="form-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update the transaction details</p>
        </div>

        <div class="auth-card">
            <form action="{{ url_for('edit_expense', id=expense.id) }}" method="POST">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" step="0.01" name="amount" class="form-input" value="{{ expense.amount }}" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category" class="form-input" required>
                        <option value="Food" {% if expense.category == 'Food' %}selected{% endif %}>Food & Dining</option>
                        <option value="Transport" {% if expense.category == 'Transport' %}selected{% endif %}>Transport</option>
                        <option value="Bills" {% if expense.category == 'Bills' %}selected{% endif %}>Bills & Utilities</option>
                        <option value="Health" {% if expense.category == 'Health' %}selected{% endif %}>Health & Medical</option>
                        <option value="Entertainment" {% if expense.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                        <option value="Shopping" {% if expense.category == 'Shopping' %}selected{% endif %}>Shopping</option>
                        <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <input type="text" name="description" class="form-input" value="{{ expense.description }}" placeholder="What was this for?">
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="date" class="form-input" value="{{ expense.date }}" required>
                </div>

                <button type="submit" class="btn-submit">Update Expense</button>
            </form>
        </div>

        <div class="auth-switch">
            <a href="{{ url_for('profile') }}">← Back to Profile</a>
        </div>
    </div>
</div>
{% endblock %}
